  <rect width="1200" height="560" rx="16" fill="url(#bg-cryo)" stroke="#155e75" stroke-width="1.5"/>

  <text x="40" y="46" fill="#38bdf8" font-family="Segoe UI, sans-serif" font-size="20" font-weight="bold" letter-spacing="1.5">CRYO-ZBO-DT • CRYOGENIC FLUIDS &amp; ACTIVE TVS DIGITAL TWIN</text>
  <text x="40" y="72" fill="#94a3b8" font-family="Segoe UI, sans-serif" font-size="13">Nukiyama Line Chilldown • Microgravity Slosh • Thermodynamic Vent System (TVS) MPC • Zero-Boil-Off</text>

  <rect x="850" y="24" width="310" height="54" rx="8" fill="#0b2433" stroke="#0ea5e9" stroke-width="1" opacity="0.9"/>
  <text x="865" y="45" fill="#38bdf8" font-family="Segoe UI, sans-serif" font-size="11" font-weight="bold">SPONSORED BY DIMASA &amp; PHIL</text>
