  <text x="60" y="205" fill="#94a3b8" font-family="Consolas, monospace" font-size="11">• LOX (90.2 K) / LN2 (77.4 K)</text>
  <text x="60" y="225" fill="#94a3b8" font-family="Consolas, monospace" font-size="11">• LCH4 (111.7 K) / LH2 (20.3 K)</text>
  <text x="60" y="245" fill="#94a3b8" font-family="Consolas, monospace" font-size="11">• Ortho-Para Exothermic Heat</text>
