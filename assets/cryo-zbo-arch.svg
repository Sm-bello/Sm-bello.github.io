  <text x="940" y="325" fill="#cbd5e1" font-family="Segoe UI, sans-serif" font-size="11">• 100% Corrupted Frame Reject</text>
  <text x="940" y="345" fill="#cbd5e1" font-family="Segoe UI, sans-serif" font-size="11">• P99 Step Latency = 1.82 ms</text>
