  <text x="950" y="430" fill="#4ade80" font-family="Segoe UI, sans-serif" font-size="10.5">✓ ASME V&amp;V 40 Standard</text>
  <text x="950" y="450" fill="#4ade80" font-family="Segoe UI, sans-serif" font-size="10.5">✓ NASA-STD-7009A Audited</text>
  <text x="950" y="468" fill="#4ade80" font-family="Segoe UI, sans-serif" font-size="10.5">✓ 16/16 Unit/Integration Pass</text>

  <!-- Closed-loop return -->
  <path d="M 1042 500 L 1042 525 L 170 525 L 170 500" fill="none" stroke="#14b8a6" stroke-width="2" stroke-dasharray="4 4"/>
  <text x="600" y="542" fill="#2dd4bf" font-family="Segoe UI, sans-serif" font-size="11" text-anchor="middle">Physical Cryogenic Valve &amp; TVS Cryocooler Actuation Loop (100 ms Minor Frame)</text>
